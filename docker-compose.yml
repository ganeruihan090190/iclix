services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iclix
      POSTGRES_USER: iclix
      POSTGRES_PASSWORD: iclix_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iclix']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://iclix:iclix_dev@postgres:5432/iclix
      JWT_SECRET: iclix-dev-secret-key-change-in-production
      PORT: 4000
      NODE_ENV: development

  web:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

volumes:
  pgdata:
